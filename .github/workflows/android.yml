name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 如果仓库根目录有上传的源码 zip：解压并覆盖到工作区（保留 .github，工作流文件需手动更新）。
      # 覆盖结果先只暂存，构建成功后才提交；构建失败则什么都不改，zip 保留以便重试。
      - name: Apply uploaded source zip
        id: apply
        run: |
          ZIP="$(ls -t ./*.zip 2>/dev/null | head -1 || true)"
          if [ -z "$ZIP" ]; then
            echo "仓库根目录没有 zip，按现有源码构建"
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "发现源码包：$ZIP"
          rm -rf "$RUNNER_TEMP/src" && mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
          shopt -s dotglob nullglob
          entries=("$RUNNER_TEMP"/src/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then SRC="${entries[0]}"; else SRC="$RUNNER_TEMP/src"; fi
          if [ ! -f "$SRC/settings.gradle.kts" ]; then
            echo "::error::zip 内未找到 settings.gradle.kts，已中止（目录结构不对）"
            exit 1
          fi
          rsync -a --exclude '.git' --exclude '.github' --exclude '*.zip' "$SRC"/ ./
          git rm -q -f -- "$ZIP"
          git add -A
          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "---- 本次将变更的文件 ----"
          git status --short | head -50

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests (informational)
        continue-on-error: true
        run: gradle --no-daemon testDebugUnitTest

      # 必须使用同一个签名密钥，否则无法覆盖安装。缺少密钥时直接失败，绝不回退到调试签名。
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/NovaCustomerDialer.jks"
          test -s "$RUNNER_TEMP/NovaCustomerDialer.jks"

      - name: Print keystore fingerprint (compare with your own keystore)
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore "$RUNNER_TEMP/NovaCustomerDialer.jks" -storepass "$KEYSTORE_PASSWORD" | grep -i "Alias name\|SHA256\|SHA-256"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/NovaCustomerDialer.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Print APK signing certificate
        continue-on-error: true
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256\|DN"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCustomerDialer-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit applied source and remove zip
        if: success() && steps.apply.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: apply uploaded source zip and remove it after successful build [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

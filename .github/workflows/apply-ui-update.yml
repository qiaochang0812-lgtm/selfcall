name: Apply high-efficiency UI and build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply verified UI update
        run: |
          base64 --decode .github/ui-clear-efficient.patch.tgz.b64 > /tmp/ui-clear-efficient.patch.tgz
          mkdir -p /tmp/ui-source
          tar -xzf /tmp/ui-clear-efficient.patch.tgz -C /tmp/ui-source
          git apply /tmp/ui-source/.tools/ui-clear-efficient.patch
          rm .github/ui-clear-efficient.patch.tgz.b64 .github/workflows/apply-ui-update.yml
          git status --short

      - name: Commit UI update
        run: |
          git config user.name "qiaochang0812-lgtm"
          git config user.email "qiaochang0812-lgtm@users.noreply.github.com"
          git add -A
          git commit -m "Refine high-efficiency UI and dialing workflow"
          git push origin HEAD:main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/NovaCustomerDialer.jks"
          test -s "$RUNNER_TEMP/NovaCustomerDialer.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/NovaCustomerDialer.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload signed UI release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCustomerDialer-ui-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

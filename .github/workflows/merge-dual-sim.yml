name: Merge verified dual-SIM update

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge verified branch
        run: |
          git config user.name "qiaochang0812-lgtm"
          git config user.email "qiaochang0812-lgtm@users.noreply.github.com"
          git fetch origin codex/dual-sim-update
          git merge --no-ff --no-commit origin/codex/dual-sim-update
          git rm .github/workflows/merge-dual-sim.yml
          git add -A
          git commit -m "Merge verified Huawei dual-SIM update"
          git push origin HEAD:main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/NovaCustomerDialer.jks"
          test -s "$RUNNER_TEMP/NovaCustomerDialer.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/NovaCustomerDialer.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload main release APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCustomerDialer-main-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

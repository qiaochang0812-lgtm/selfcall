name: Import verified source and build APK

on:
  push:
    branches: ["codex/dual-sim-update"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply verified source update
        run: |
          base64 --decode .github/source-update.patch.tgz.b64 > /tmp/source-update.patch.tgz
          mkdir -p /tmp/source-extract
          tar -xzf /tmp/source-update.patch.tgz -C /tmp/source-extract
          git apply /tmp/source-extract/.tools/codex-dual-sim.patch
          rm .github/source-update.patch.tgz.b64 .github/workflows/import-source.yml
          git status --short

      - name: Commit source update
        run: |
          git config user.name "qiaochang0812-lgtm"
          git config user.email "qiaochang0812-lgtm@users.noreply.github.com"
          git add -A
          git commit -m "Fix Huawei dual-SIM direct dialing and redesign settings"
          git push origin HEAD:codex/dual-sim-update

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/NovaCustomerDialer.jks"
          test -s "$RUNNER_TEMP/NovaCustomerDialer.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/NovaCustomerDialer.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaCustomerDialer-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
